name: Set repository metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/set-repo-metadata.yml

permissions:
  administration: write

jobs:
  about:
    runs-on: ubuntu-latest
    steps:
      - name: Update description and topics
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const description =
              'Zero-standing-access AWS break glass system using Entra PIM, Azure Automation, Power Automate and Microsoft Graph API';

            await github.rest.repos.update({ owner, repo, description });

            await github.rest.repos.replaceAllTopics({
              owner,
              repo,
              names: [
                'powershell',
                'azure-automation',
                'entra-pim',
                'microsoft-graph',
                'aws',
                'jira-automation',
                'privileged-access',
                'break-glass',
                'iam',
              ],
            });
